global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ['alertname', 'severity', 'service', 'instance']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

inhibit_rules:
  - source_match:
      severity: critical
      service: mc-bedrock
    target_match:
      severity: warning
      service: mc-bedrock

receivers:
  - name: slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}" 
        channel: "${CHANNEL}"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *summary:* {{ .Annotations.summary }}
          {{- if .Annotations.description }}
          *desc:* {{ .Annotations.description }}
          {{- end }}
          *service:* {{ .Labels.service }}
          {{- if .Labels.instance }}
          *instance:* {{ .Labels.instance }}
          {{- end }}
          *severity:* {{ .Labels.severity }}
          *startsAt:* {{ .StartsAt }}

          {{ end }}
