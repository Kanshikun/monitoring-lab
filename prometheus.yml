global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: gpu
    static_configs:
      - targets: ['dcgm-exporter:9400']

  - job_name: minecraft
    static_configs:
      - targets: ['mc-monitor:9150']

  - job_name: 'mc-monitor-aws'
    static_configs:
      - targets: ['3.26.153.111:8080']
